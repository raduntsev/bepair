name: Native apps

# Builds the iOS and Android shells with their widgets.
# Set the repository variable BEPAIR_URL (Settings → Secrets and variables →
# Actions → Variables) to override the Vercel address; without it the build
# points at the production deployment, bepair.vercel.app.

on:
  push:
    branches: [main, feature/native-widgets]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/native.ts'
      - '.github/workflows/native.yml'
  workflow_dispatch:

# Publishing the APK to the «android-latest» release needs write access to contents.
permissions:
  contents: write

env:
  BEPAIR_URL: ${{ vars.BEPAIR_URL || 'https://bepair.vercel.app' }}

jobs:
  android:
    name: Android (APK + widget render tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      # Optional: a fixed signing key, so every new APK installs over the old one.
      # Secrets: ANDROID_KEYSTORE_BASE64 (base64 of the .keystore file) and
      # ANDROID_KEYSTORE_PASSWORD; ANDROID_KEY_ALIAS defaults to «vpare».
      - name: Use the project signing key, if there is one
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > android/app/vpare.keystore
            echo "::notice::Signed with the project key"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: a throwaway debug key is used"
          fi
      - name: Test widgets and build the debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vpare-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # A stable download link for the phone:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/vpare.apk
      - name: Publish the APK to the «android-latest» release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk vpare.apk
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Впаре для Android" \
              --notes "Последняя сборка приложения для Android. Скачайте vpare.apk на телефон и откройте файл."
          gh release upload android-latest vpare.apk --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-widget-previews
          path: android/app/build/widget-previews/

  ios:
    name: iOS (app + widget extension, simulator build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the simulator (no signing)
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          # Surface compiler errors as annotations, so they show on the commit.
          grep -E '^/.+:[0-9]+:[0-9]+: error: ' build.log | sort -u | head -40 | \
            sed -E 's#^'"$GITHUB_WORKSPACE"'/##; s#^([^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=\1,line=\2,col=\3::\4#'
          grep -E 'error:|BUILD (SUCCEEDED|FAILED)' build.log | grep -vE '^/.+:[0-9]+:[0-9]+: error: ' | sort -u | head -20 | sed 's/^/::warning::/'
          # Prove the widget extension was compiled and embedded, not silently skipped.
          compiled=$(grep -cE '(SwiftCompile|CompileSwift)[^\n]*VpareWidget/' build.log || true)
          embedded=$(grep -c 'VpareWidget.appex' build.log || true)
          echo "::notice::Widget extension: ${compiled} Swift compile steps, ${embedded} .appex references"
          tail -5 build.log
          if [ "$status" -eq 0 ] && [ "$embedded" -eq 0 ]; then echo "::error::VpareWidget.appex was not built"; exit 1; fi
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: build.log
